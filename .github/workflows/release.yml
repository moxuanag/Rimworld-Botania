name: release

# 打 tag（v0.1.0 这种）就自动校验并打包，把 zip 挂到 Release 上。
# 也可以手动触发，只产出构建产物、不建 Release。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP '(?<=<modVersion>)[^<]+' About/About.xml)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "本次版本：${VERSION}"

      - name: 版本与程序集检查
        run: python3 scripts/check_version.py "${{ steps.ver.outputs.version }}"

      - name: XML 语法检查
        run: python3 scripts/validate_xml.py

      - name: 组装发布目录
        run: |
          set -euo pipefail
          mkdir -p dist stage/Botania
          for d in About Assemblies Defs Languages Textures Patches; do
            if [ -d "$d" ]; then
              cp -r "$d" stage/Botania/
            fi
          done
          # 源码不进游戏包，但保留在仓库里
          cd stage
          zip -r "../dist/Rimworld-Botania-${{ steps.ver.outputs.version }}.zip" Botania
          cd ..
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Rimworld-Botania-${{ steps.ver.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: 从 CHANGELOG 抽本版说明
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          python3 - "$V" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^<!-- release-notes-end -->|\Z)"
          match = re.search(pattern, text, re.S | re.M)
          body = match.group(1).strip() if match else ""
          if not body:
              body = f"本版变更见 CHANGELOG.md（未找到 `## [{version}]` 小节）。"
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          print(f"Release 正文：{len(body)} 字符")
          PY

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          files: dist/*.zip
          fail_on_unmatched_files: true
